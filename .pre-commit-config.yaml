default_language_version:
  python: python3.12

# Frozen circuits, eval shards and manifests are generator output; their bytes
# belong to the generator, never to a hook.
exclude: ^data/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  # Delegates to the Makefile so the hook and the gate are one command, run by
  # the ruff that uv.lock pins.
  - repo: local
    hooks:
      - id: fmt
        name: make fmt
        entry: make fmt
        language: system
        pass_filenames: false
        always_run: true
      - id: lint
        name: make lint
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true
