# Memory d=7 evaluation - per-distance checkpoint

operation: "memory"
# The finished run of train_memory_d7.yaml: its directory is named by
# that config and its circuits, so this path changes whenever either does.
checkpoint: "outputs/runs/memory/d7/f65369167188/best.pt"
distances: [7]
batch_size: 256

# Decoder suite
include_belief_matching: true
include_tesseract: false

# Sanity eval settings
shots: 100_000
seed: 99
