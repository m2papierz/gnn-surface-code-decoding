# Memory d=3 training - per-distance model
# Trains on the d=3 circuits of every error probability in the memory root.

backend: "compiled"
compile_mode: "default"
amp_dtype: "bfloat16"

# Experiment
operation: "memory"

# Root of the run directories; a run's directory is named by its config and circuits.
output_dir: "./outputs/runs"

# Distance filter
distances: [3]

# Model architecture
model:
  hidden_dim: 192
  num_layers: 8
  dropout: 0.1

# Optimisation
optimisation:
  lr: 1.5e-4
  weight_decay: 1.0e-5
  batch_size: 128

# Sample budget
sample_budget: 5_000_000

# Validate every 50k samples for frequent monitoring.
val_interval_samples: 50_000

# Frozen validation set size.
val_size: 10_000

# LR warmup fraction.
warmup_fraction: 0.05

# No p conditioning for per-distance training.
include_p_feature: false

# Data loading
num_workers: 4

# Gradient clipping
max_grad_norm: 1.0

# Early stopping disabled: training spends the whole budget.
patience: 0

# Reproducibility
seed: 42
