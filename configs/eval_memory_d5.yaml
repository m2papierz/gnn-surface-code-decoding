# Memory d=5 evaluation - per-distance checkpoint

operation: "memory"
# The finished run of train_memory_d5.yaml: its directory is named by
# that config and its circuits, so this path changes whenever either does.
checkpoint: "outputs/runs/memory/d5/112ff51e72f1/best.pt"
distances: [5]
batch_size: 256

# Decoder suite
include_belief_matching: true
include_tesseract: false

# Sanity eval settings
shots: 100_000
seed: 99
