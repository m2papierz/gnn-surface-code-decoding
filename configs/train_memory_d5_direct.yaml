# d=5 training - per-distance model
# Trains only on d=5 circuits across all 4 error probabilities.

backend: "compiled"
compile_mode: "default"
amp_dtype: "bfloat16"

# Experiment
operation: "memory"

# Data paths
output_dir: "./outputs/runs"

# Distance filter
distances: [5]

# Model architecture
model:
  hidden_dim: 192
  num_layers: 8
  dropout: 0.1

# Optimisation
optimisation:
  lr: 1.5e-4
  weight_decay: 1.0e-5
  batch_size: 128

# Sample budget
sample_budget: 15_000_000

# Validate every 200k samples.
val_interval_samples: 200_000

# Frozen validation set size.
val_size: 10_000

# LR warmup fraction.
warmup_fraction: 0.05

# No p conditioning for per-distance training.
include_p_feature: false

# Data loading
num_workers: 4

# Gradient clipping
max_grad_norm: 1.0

# Early stopping
patience: 30

# Reproducibility
seed: 42
