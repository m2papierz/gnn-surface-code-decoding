# Memory d=3 evaluation - per-distance checkpoint

operation: "memory"
# The finished run of train_memory_d3.yaml: its directory is named by
# that config and its circuits, so this path changes whenever either does.
checkpoint: "outputs/runs/memory/d3/103afd445035/best.pt"
distances: [3]
batch_size: 256

# Decoder suite
include_belief_matching: true
include_tesseract: false

# Sanity eval settings
shots: 100_000
seed: 99
