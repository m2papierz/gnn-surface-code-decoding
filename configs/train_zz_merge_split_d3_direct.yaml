# ZZ merge-split d=3 training - L1 checkpoint
# Single distance (d=3), single operation, direct trainer.
# Budget: 10M samples (declared in TASKS_LATTICE_SURGERY.md LS15).

backend: "compiled"
compile_mode: "default"
amp_dtype: "bfloat16"

# Experiment
operation: "zz_merge_split"

# Data paths
output_dir: "./outputs/runs"

# Model architecture
model:
  hidden_dim: 192
  num_layers: 8
  dropout: 0.1

# Optimisation
optimisation:
  lr: 1.5e-4
  weight_decay: 1.0e-5
  batch_size: 128

# Sample budget
sample_budget: 10_000_000

# Validate every 100k samples.
val_interval_samples: 100_000

# Frozen validation set size.
val_size: 10_000

# LR warmup fraction.
warmup_fraction: 0.05

# No p conditioning.
include_p_feature: false

# Data loading
num_workers: 4

# Gradient clipping
max_grad_norm: 1.0

# Early stopping: 30 checks without improvement.
patience: 30

# Single distance
distances: [3]

# Reproducibility
seed: 42
