[project]
name = "gnn-surface-code-decoding"
version = "0.1.0"
description = "GNN decoders for surface code quantum error correction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ninja>=1.13.0",
    "numpy>=2.3.5",
    "pymatching>=2.3.1",
    "pyyaml>=6.0.3",
    "stim==1.15.0",
    "torch>=2.9.1",
    "torch-geometric>=2.7.0",
    "beliefmatching>=0.1.1",
    "tqec==0.2.0",
    "tesseract-decoder==0.1.1.dev20260802231159",
]

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.11",
]

[tool.uv]
package = true
index-strategy = "unsafe-best-match"
# tqec 0.2.0 declares numpy<2.3 — a stale upper bound that tqec does not
# actually need.  Override so our numpy>=2.3.5 resolves.
override-dependencies = ["numpy>=2.2.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
